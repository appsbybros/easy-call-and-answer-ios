name: TestFlight upload
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: New build number (higher than the app's previous upload)
        required: true
        default: '1'
permissions:
  contents: read
  actions: read
concurrency:
  group: easycall-testflight
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require passing verification for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,3}$ ]] || { echo 'Build number must be 1–9999.'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=20" > "$RUNNER_TEMP/verification.json"
          python3 - <<'PY'
          import json,os
          runs=json.load(open(os.environ['RUNNER_TEMP']+'/verification.json'))['workflow_runs']
          assert any(x['conclusion']=='success' for x in runs), 'Run Build, test and capture iOS successfully on this commit first.'
          PY
      - name: Install distribution signing assets
        env:
          DISTRIBUTION_P12_BASE64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY DISTRIBUTION_P12_BASE64 PROVISION_PROFILE_BASE64; do
            [ -n "${!name}" ] || { echo "Missing repository secret: $name"; exit 1; }
          done
          python3 Scripts/signing.py prepare
          keychain="$RUNNER_TEMP/easycall.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -P "$DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 Scripts/signing.py validate
      - name: Archive and export a signed app
        run: |
          set -euo pipefail
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          mkdir -p build
          xcodebuild archive -project EasyCall.xcodeproj -scheme EasyCall -configuration Release -destination 'generic/platform=iOS' -archivePath build/EasyCall.xcarchive CURRENT_PROJECT_VERSION="$BUILD_NUMBER" DEVELOPMENT_TEAM="$SIGNING_TEAM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" 2>&1 | tee build/archive.log
          xcodebuild -exportArchive -archivePath build/EasyCall.xcarchive -exportPath build/export -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" 2>&1 | tee build/export.log
      - name: Upload to App Store Connect
        run: |
          set -euo pipefail
          xcrun altool --validate-app -f build/export/EasyCall.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee build/validate.log
          xcrun altool --upload-app -f build/export/EasyCall.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee build/upload.log
          echo 'Upload accepted. Check App Store Connect for processing and any subsequent rejection.' >> "$GITHUB_STEP_SUMMARY"
      - name: Clean signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/easycall.keychain-db" || true
          python3 Scripts/signing.py clean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EasyCall-TestFlight-logs
          path: build/*.log
          retention-days: 7
