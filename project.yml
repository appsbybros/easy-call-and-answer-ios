name: EasyCall
options:
  bundleIdPrefix: com.appsbybros
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
  knownRegions: [en, he]
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  EasyCall:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        excludes: [Info.plist]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Easy Call
        LSApplicationQueriesSchemes: [tel, facetime-audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appsbybros.easycall
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
  EasyCallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies:
      - target: EasyCall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appsbybros.easycall.uitests
        GENERATE_INFOPLIST_FILE: YES
  EasyCallTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Hosted]
    dependencies:
      - target: EasyCall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appsbybros.easycall.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EasyCall:
    build:
      targets:
        EasyCall: all
        EasyCallUITests: [test]
        EasyCallTests: [test]
    test:
      gatherCoverageData: true
      targets: [EasyCallTests, EasyCallUITests]
    archive:
      config: Release
